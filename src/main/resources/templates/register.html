<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SecureBank</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #003366, #00509e);
        }

        .register-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #003366;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 20px;
        }

        .error {
            color: red;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            border-color: #00509e;
            outline: none;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            user-select: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #003366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00509e;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .bottom a {
            text-decoration: none;
            color: #003366;
            font-weight: bold;
        }

        .bottom a:hover {
            color: #00509e;
        }

    </style>

</head>

<body>

<div class="register-box">

    <div class="logo">
        🏦
    </div>

    <h2>
        Create Bank Account
    </h2>

    <p class="subtitle">
        Open your secure online banking account
    </p>

    <!-- Error message -->
    <div
            class="error"
            th:if="${error}"
            th:text="${error}">
    </div>

    <form
            th:action="@{/register}"
            method="post">

        <!-- Full Name -->
        <label>
            Full Name
        </label>

        <input
                type="text"
                name="name"
                placeholder="Enter Full Name"
                required>

        <!-- Email -->
        <label>
            Email Address
        </label>

        <input
                type="email"
                name="email"
                placeholder="Enter Email Address"
                required>

        <!-- Account Number -->
        <label>
            Account Number
        </label>

        <input
                type="text"
                name="accountNumber"
                placeholder="Enter Account Number"
                minlength="6"
                maxlength="20"
                required>

        <!-- Password -->
        <label>
            Password
        </label>

        <div class="password-box">

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create Password"
                    required>

            <span
                    class="eye"
                    onclick="togglePassword()">
                👁
            </span>

        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="bottom">

        Already have an account?

        <a th:href="@{/login}">
            Login
        </a>

    </div>

</div>

<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        if (password.type === "password") {

            password.type = "text";

        } else {

            password.type = "password";

        }

    }

</script>

</body>

</html>
