<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deposit Money | Online Banking</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #003366;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #003366;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #00509e;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #003366;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>
        Deposit Money
    </h2>

    <p
            class="error"
            th:if="${error}"
            th:text="${error}">
    </p>

    <form
            th:action="@{/deposit}"
            method="post">

        <input
                type="number"
                step="0.01"
                min="0.01"
                name="amount"
                placeholder="Enter Amount"
                required>

        <button type="submit">
            Deposit
        </button>

    </form>

    <a
            th:href="@{/dashboard}"
            class="back">
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
