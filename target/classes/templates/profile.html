<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Online Banking</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #003366, #00509e);
        }

        .container {
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #003366;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 14px 10px;
            border-bottom: 1px solid #eeeeee;
        }

        td:first-child {
            font-weight: bold;
            color: #003366;
            width: 40%;
        }

        td:last-child {
            color: #333333;
        }

        .balance {
            font-weight: bold;
            color: green !important;
        }

        .btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 13px;
            background: #003366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            background: #00509e;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        👤
    </div>

    <h2>
        My Profile
    </h2>

    <p class="subtitle">
        Your Account Information
    </p>

    <table>

        <tr>
            <td>
                Full Name
            </td>

            <td th:text="${customer.name}">
                Name
            </td>
        </tr>

        <tr>
            <td>
                Email
            </td>

            <td th:text="${customer.email}">
                Email
            </td>
        </tr>

        <tr>
            <td>
                Account Number
            </td>

            <td th:text="${customer.accountNumber}">
                Account Number
            </td>
        </tr>

        <tr>
            <td>
                Balance
            </td>

            <td class="balance">

                ₹ <span th:text="${customer.balance}">
                    0.00
                </span>

            </td>
        </tr>

    </table>

    <a th:href="@{/dashboard}" class="btn">
        Back to Dashboard
    </a>

</div>

</body>

</html>
