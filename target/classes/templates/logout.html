<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction Successful | Online Banking</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #003366, #00509e);
        }

        .card {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
            animation: fadeIn .7s;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .check {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #28a745;
            color: white;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            animation: pop .6s;
        }

        @keyframes pop {

            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }

        h1 {
            margin-top: 25px;
            color: #003366;
        }

        h2 {
            margin-top: 15px;
            color: #28a745;
        }

        p {
            margin-top: 15px;
            color: #555;
            font-size: 17px;
            line-height: 28px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 24px;
            text-decoration: none;
            color: white;
            background: #003366;
            border-radius: 8px;
            transition: .3s;
        }

        .btn:hover {
            background: #00509e;
        }

        .btn-secondary {
            background: #28a745;
        }

        .btn-secondary:hover {
            background: #218838;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="check">
        ✔
    </div>

    <h1>
        Transaction Successful
    </h1>

    <h2 th:text="${message}">
        Success
    </h2>

    <p>

        Thank you for banking with us. ❤️

        <br><br>

        Your transaction has been completed successfully.

        <br>

        The transaction has been saved successfully.

    </p>

    <div class="buttons">

        <a
                th:href="@{/dashboard}"
                class="btn">

            Dashboard

        </a>

        <a
                th:href="@{/transactions}"
                class="btn btn-secondary">

            Transaction History

        </a>

    </div>

</div>

</body>

</html>
